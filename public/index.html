<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think While You Speak</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.12/dist/bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f7;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .status {
      background-color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background-color: #0071e3;
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
    }
    button:disabled {
      background-color: #ccc;
    }
    #startBtn {
      background-color: #34c759;
    }
    #stopBtn {
      background-color: #ff3b30;
    }
    .settings-panel {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .settings-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: bold;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .debug {
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      background-color: #333;
      color: #fff;
      border-radius: 5px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Think While You Speak</h1>
    
    <div class="status" id="status">Ready</div>
    
    <div class="controls">
      <button id="startBtn">Start Listening</button>
      <button id="stopBtn" disabled>Stop Listening</button>
      <button id="settingsBtn">Settings</button>
    </div>
    
    <div class="settings-panel" id="settingsPanel" style="display: none;">
      <h2>Settings</h2>
      <div class="settings-form">
        <div class="form-group">
          <label for="serverUrl">Server URL</label>
          <input type="text" id="serverUrl" placeholder="http://server-address:3000">
        </div>
        <button id="saveSettingsBtn">Save Settings</button>
        <button id="cancelSettingsBtn">Cancel</button>
      </div>
    </div>
    
    <div class="debug" id="debug"></div>
  </div>
  
  <script src="/js/main.js"></script>
</body>
</html>
